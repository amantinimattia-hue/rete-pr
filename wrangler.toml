name = "happy-pr"
main = "dist/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Le variabili ADMIN_EMAILS, TEAM_DOMAIN e POLICY_AUD si impostano nel pannello Cloudflare
# (Worker > Impostazioni > Variabili e segreti): keep_vars evita che ogni pubblicazione le cancelli.
keep_vars = true

[build]
command = "node build.mjs"

[[d1_databases]]
binding = "DB"
database_name = "rete-pr"
database_id = "7cda0062-7710-4b1c-8177-4e399e38f99f"
