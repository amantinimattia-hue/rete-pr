<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rete PR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: gestionale denso e veloce, pensato per centinaia di nomi
   IDEA: il pass del backstage: fascia arancio piena, etichette nette, numeri grossi
   PICTURE: lo strumento stesso, tabelle fitte, albero dello staff, colonne delle serate
   COLOUR and TYPE: arancio dominante, rosso per i biglietti, giallo per i tavoli; Plus Jakarta Sans
   LAYOUT: barra arancio compatta con le sezioni a pillola, contenuto a griglia stretta, liste lunghe che scorrono nel loro riquadro */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#140c08);--panel:light-dark(#fff5ee,#22150e);--line:light-dark(#f1e1d6,#3a271c);
--ink:light-dark(#2a1309,#fff1e8);--mute:light-dark(#8a6552,#c3a593);
--or:#ff6a13;--inc:light-dark(#7a2e0e,#f3b98f);--red:light-dark(#e3301c,#ff5a3d);--yel:#ffbf1f;--ok:light-dark(#1f7a4d,#5fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
header{background:var(--or);color:#2a1309;padding:12px max(3vw,14px)}
.hd{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
header h1{margin:0;font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em}
header p{margin:3px 0 0;font-size:13px;font-weight:500;color:#5a2408}header p a{color:inherit;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;background:rgb(0 0 0/.12);padding:4px;border-radius:12px;margin-left:auto}
nav a{flex:none;color:#2a1309;text-decoration:none;padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px}
nav a.on{background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.15)}
main{max-width:1400px;margin:0 auto;padding:18px max(3vw,14px) 48px}
h2{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:800}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
.sub{color:var(--mute);margin:2px 0 0;font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 12px}
.kpi{background:var(--panel);border-radius:10px;padding:8px 12px;border-top:3px solid var(--or)}
.kpi b{display:block;font-size:22px;line-height:1.15;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:12.5px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:10px;margin:0 0 12px}
.card{background:var(--panel);border-radius:12px;padding:10px 12px}
.bars{max-height:190px;overflow-y:auto;padding-right:4px}
.bar{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 2.4em;gap:6px;align-items:center;font-size:13px;margin:2px 0}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bt i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--red));border-radius:5px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:700;min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:none;border-color:transparent;color:var(--red);padding:0 6px}
button.danger{color:var(--red);border-color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible,summary:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;min-height:38px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px}
label{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
label>input,label>select,label>textarea{margin-top:3px;color:var(--ink)}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;margin:0 0 8px;align-items:end}
.tbl{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.tbl.s{max-height:380px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:7px 10px;background:var(--panel);position:sticky;top:0;z-index:1;white-space:nowrap}
th[data-so]{cursor:pointer;user-select:none}th[data-so]:hover{color:var(--ink)}th.on{color:var(--red)}
td{padding:5px 10px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{color:var(--mute);font-size:12px;font-weight:400}
td .note.i{display:inline;margin-left:8px}td .note{display:block;max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.staff{background:var(--red);color:#fff}.tag.capo{background:var(--yel);color:#2a1309}
.link{background:none;border:0;padding:0;min-height:0;color:inherit;font-weight:700;text-align:left;cursor:pointer;font-size:inherit}
.link:hover{color:var(--red);text-decoration:underline}
.empty{color:var(--mute);font-size:13px;margin:4px 0}
.tree{display:grid;gap:8px}
.node{background:var(--panel);border-radius:12px;padding:8px 12px;border-left:4px solid var(--red)}
.node .node{margin-top:6px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--red)}.node>summary{list-style:none;cursor:pointer}.node>summary::-webkit-details-marker{display:none}
.node>summary::before{content:"▸";color:var(--mute);margin-right:2px;display:inline-block;transition:transform .15s}
.node[open]>summary::before{transform:rotate(90deg)}
.node .c{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--yel);border-radius:10px;padding:6px 10px;margin-top:6px}
.nh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.tot{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12.5px;white-space:nowrap}
.tot b{color:var(--ink)}
.leaves{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.leaf{display:inline-flex;gap:5px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:12.5px}
.leaf>span{background:var(--panel);border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums;color:var(--mute)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 0 12px}
.tabs small{color:var(--mute);margin:0 2px 0 8px;font-size:12px;font-weight:600}
.tabs button{min-height:32px;border-radius:99px;font-size:13px;padding:0 12px}
.tabs button.on{background:var(--or);color:#2a1309;border-color:var(--or)}
.fig{position:relative;min-height:200px}.fig.sm{min-height:140px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font:11px "Plus Jakarta Sans",sans-serif;fill:var(--mute)}.fig .v{fill:var(--ink);font-weight:700}
.scroll{overflow-x:auto}
#modal{position:fixed;inset:0;background:rgb(30 10 2/.55);display:none;align-items:flex-start;justify-content:center;padding:3vh 10px;overflow-y:auto;z-index:9}
#modal.on{display:flex}
.sheet{background:var(--bg);border-radius:16px;width:min(720px,100%);padding:16px clamp(14px,3vw,22px);box-shadow:0 20px 60px rgb(0 0 0/.35);border-top:5px solid var(--or)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin:10px 0}
.form .w{grid-column:1/-1}
.msg{min-height:20px;color:var(--red);font-size:13px;margin:4px 0}
.msg.ok{color:var(--ok)}
.rl{max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.rr{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;}.rr.inc{grid-template-columns:minmax(0,1fr) 70px 70px 90px}.rr{gap:6px;align-items:center;padding:3px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.rr:last-child{border-bottom:0}.rr.has{background:var(--panel)}
.rr input{text-align:right;min-height:32px;padding:3px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
details>summary{cursor:pointer}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10}
#toast.on{opacity:1}
#banner{display:none;background:var(--red);color:#fff;padding:6px max(3vw,14px);font-size:13px}
@media(prefers-reduced-motion:reduce){#toast,.node>summary::before{transition:none}}
@media(max-width:800px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters>:first-child{grid-column:1/-1}nav{margin-left:0}}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr)}.stack thead{display:none}.stack tr{display:grid;padding-block:6px;border-top:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 10px;padding-inline-start:calc(7em + 10px);text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mute);font-size:12px}.stack td:empty{display:none}.bar{grid-template-columns:minmax(0,7em) minmax(0,1fr) 2.2em}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header><div class="hd">
  <div><h1>Rete PR</h1><p id="who">Anagrafica, struttura dello staff e risultati delle serate</p></div>
  <nav id="nav">
    <a href="#archivio" data-v="archivio">Archivio</a>
    <a href="#struttura" data-v="struttura">Struttura</a>
    <a href="#serate" data-v="serate" data-adm="1">Serate</a>
    <a href="#report" data-v="report">Report</a>
    <a href="#punti" data-v="punti">Punti</a>
    <a href="#accessi" data-v="accessi" data-adm="1">Accessi</a>
  </nav>
</div></header>
<div id="banner"></div>
<main id="main"><p class="empty">Caricamento dell'archivio…</p></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
{
const S={me:null,utenti:[],so:{k:'ruolo',d:1},db:null,pr:[],loc:[],ser:[],got:{},q:'',fR:'',fS:'',fZ:'',rep:'all',repPr:'',draft:null,rq:'',charts:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RUOLI={staff:'Capo staff',capo:'Capo PR',pr:'PR'};
const ORD={staff:0,capo:1,pr:2};
const nome=p=>p?([p.nome,p.cognome].filter(Boolean).join(' ')||'Senza nome'):'PR eliminato';
const byId=id=>S.pr.find(p=>p.id===id);
const figli=id=>S.pr.filter(p=>p.parent===id);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const fmtD=d=>{if(!d)return '—';const [y,m,g]=d.split('-');return `${g}/${m}/${y.slice(2)}`};
const sortNome=(a,b)=>nome(a).localeCompare(nome(b),'it');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
const banner=t=>{const b=$('#banner');b.textContent=t||'';b.style.display=t?'block':'none'};
const locName=id=>S.loc.find(l=>l.id===id)?.nome||'';
const etaTxt=l=>l&&l.tipo==='format'?(l.eta_min?l.eta_min+'+':'età da indicare'):'';
const serOrd=()=>[...S.ser].sort((a,b)=>(a.data||'').localeCompare(b.data||''));
const R=(s,id)=>{const x=(s.ris||{})[id];return typeof x==='number'?{b:x,t:0,e:0}:{b:+(x&&x.b)||0,t:+(x&&x.t)||0,e:+(x&&x.e)||0}};
const add=(a,r)=>(a.b+=r.b,a.t+=r.t,a.e=(a.e||0)+(r.e||0),a);
const EUR=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const EUR2=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2});
const eur=c=>((c||0)%100?EUR2:EUR).format((c||0)/100); // incasso salvato in centesimi
const cent=v=>{const n=parseFloat(String(v||'').replace(/\s|€/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));return Number.isFinite(n)&&n>0?Math.round(n*100):0};
const misuraDi=fid=>S.loc.find(l=>l.id===fid)?.misura==='incasso'?'incasso':'persone';
const vend=(id,ser)=>ser.reduce((a,s)=>add(a,R(s,id)),{b:0,t:0});
const team=(id,ser)=>{const a=vend(id,ser);for(const c of figli(id))add(a,team(c.id,ser));return a};
const sumSer=s=>Object.keys(s.ris||{}).reduce((a,id)=>add(a,R(s,id)),{b:0,t:0,e:0});
const BT=v=>`<b>${v.b}</b> bigl. · <b>${v.t}</b> tav.${v.e?` · <b>${eur(v.e)}</b>`:''}`;
const view=()=>{const h=location.hash.slice(1);return h.startsWith('persona-')?'persona':['archivio','struttura','serate','report','punti','accessi'].includes(h)?h:'archivio'};

/* ---------- grafici ---------- */
const bars=(rows)=>{if(!rows.length)return '<p class="empty">Nessun dato</p>';const m=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(([k,v])=>`<div class="bar"><span class="bl" title="${esc(k)}">${esc(k)}</span><span class="bt"><i style="width:${(v/m*100).toFixed(1)}%"></i></span><b>${v}</b></div>`).join('')};
const gruppo=(f,sortKey)=>{const m=new Map();let nd=0;for(const p of S.pr){const v=String(p[f]??'').trim();if(!v){nd++;continue}m.set(v,(m.get(v)||0)+1)}
  let r=[...m];r.sort(sortKey?(a,b)=>a[0].localeCompare(b[0]):(a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'it'));
  if(!sortKey&&r.length>12){const alt=r.slice(11).reduce((t,x)=>t+x[1],0);r=r.slice(0,11).concat([['Altre',alt]])}
  if(nd)r.push(['Non indicato',nd]);return r};
const colChart=(id,pts)=>{S.charts[id]=pts;return `<div class="fig${id[0]==='p'?' sm':''}"><svg data-c="${id}" role="img" aria-label="Grafico a colonne"></svg></div>`};
/* grafico a colonne raggruppate: per ogni serata TicketSMS, tavoli e (se c'è) incasso, con l'asse € a destra */
const groupChart=(id,data)=>{S.charts[id]={grp:true,...data};return `<div class="fig"><svg data-c="${id}" role="img" aria-label="Grafico a colonne raggruppate"></svg></div>`};
const tick=m=>{const st=Math.max(1,Math.ceil(m/4/(m>20?5:1))*(m>20?5:1));return {st,top:Math.ceil(Math.max(1,m)/st)*st}};
function drawGrp(s,g){const W=s.clientWidth,H=s.clientHeight,pts=g.pts,se=g.serie;
  if(!pts.length){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">Nessuna serata con risultati</text>`;return}
  const hasR=se.some(x=>x.ax==='r'),L=32,Rm=hasR?46:6,T=16,B=24,iw=W-L-Rm,ih=H-T-B,n=pts.length,k=se.length;
  const aL=tick(Math.max(0,...pts.flatMap(p=>se.map((x,j)=>x.ax==='l'?p.v[j]:0)))),aR=tick(Math.max(0,...pts.flatMap(p=>se.map((x,j)=>x.ax==='r'?p.v[j]:0))));
  const bw=iw/n,w=Math.max(3,Math.min(18,bw*.8/k)),every=Math.ceil(n/Math.max(1,Math.floor(iw/(W<520?56:48))));let o='';
  for(let i=0;i<=4;i++){const y=T+ih-i/4*ih,vl=aL.top*i/4,vr=aR.top*i/4;o+=`<line x1="${L}" x2="${W-Rm}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;
    if(Number.isInteger(vl))o+=`<text x="${L-6}" y="${y+4}" text-anchor="end">${vl}</text>`;if(hasR)o+=`<text x="${W-Rm+6}" y="${y+4}" style="fill:var(--inc)">${Math.round(vr)}€</text>`}
  pts.forEach((p,i)=>{const x0=L+i*bw+(bw-k*w)/2;se.forEach((x,j)=>{const top=x.ax==='r'?aR.top:aL.top,v=p.v[j],h=v/top*ih,xx=x0+j*w,y=T+ih-h;
      o+=`<rect x="${xx}" y="${y}" width="${w-1}" height="${Math.max(h,v?2:0)}" rx="2" fill="${x.c}"><title>${esc(p.t)} · ${x.n}: ${x.ax==='r'?v+' €':v}</title></rect>`;
      if(v&&w>=16)o+=`<text class="v" x="${xx+w/2-.5}" y="${y-4}" text-anchor="middle" style="font-size:10px">${v}</text>`});
    if(i%every===0)o+=`<text x="${L+i*bw+bw/2}" y="${H-7}" text-anchor="middle">${esc(p.l)}</text>`});
  s.innerHTML=o}
const draw=()=>{for(const s of document.querySelectorAll('svg[data-c]')){const cg=S.charts[s.dataset.c];if(cg&&cg.grp){if(s.clientWidth)drawGrp(s,cg);continue}const pts=cg||[];const W=s.clientWidth,H=s.clientHeight;if(!W)continue;
  if(!pts.length){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">Nessuna serata con risultati</text>`;continue}
  const col=/^[pq]?t$/.test(s.dataset.c)?'var(--yel)':/^[pq]?e$/.test(s.dataset.c)?'var(--inc)':'var(--red)';const L=32,R=6,T=16,B=24,iw=W-L-R,ih=H-T-B,n=pts.length,max=Math.max(1,...pts.map(p=>p.v));
  const step=Math.max(1,Math.ceil(max/4/(max>20?5:1))*(max>20?5:1));const top=Math.ceil(max/step)*step;
  const bw=iw/n,w=Math.min(52,bw*.7),every=Math.ceil(n/Math.max(1,Math.floor(iw/(W<520?56:48))));let g='';
  for(let v=0;v<=top;v+=step){const y=T+ih-v/top*ih;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`}
  pts.forEach((p,i)=>{const h=p.v/top*ih,x=L+i*bw+(bw-w)/2,y=T+ih-h;
    if(p.segs){let yy=T+ih;for(const sg of p.segs){if(!sg.v)continue;const hh=sg.v/top*ih;yy-=hh;g+=`<rect x="${x}" y="${yy}" width="${w}" height="${hh}" fill="${sg.c}" stroke="var(--panel)" stroke-width="1"><title>${esc(p.t)} · ${esc(sg.n)}: ${sg.v}</title></rect>`}}
    else g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,p.v?2:0)}" rx="3" fill="${p.v?col:'var(--line)'}"><title>${esc(p.t)}: ${p.v}</title></rect>`;
    if(bw>=24&&p.v)g+=`<text class="v" x="${x+w/2}" y="${y-5}" text-anchor="middle">${p.v}</text>`;
    if(i%every===0)g+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${esc(p.l)}</text>`});
  s.innerHTML=g}};
const ro=new ResizeObserver(draw);ro.observe($('#main'));

/* ---------- archivio ---------- */
function filtrati(){const q=norm(S.q);return S.pr.filter(p=>(!S.fR||p.ruolo===S.fR)&&(!S.fS||p.scuola===S.fS)&&(!S.fZ||p.zona===S.fZ)&&
  (!q||norm([p.nome,p.cognome,p.scuola,p.zona,p.tel,p.note].join(' ')).includes(q))).map(p=>({p,v:vend(p.id,S.ser)})).sort((A,B)=>{const {k,d}=S.so,a=A.p,b=B.p;
  const key=x=>k==='nome'?nome(x.p):k==='ruolo'?ORD[x.p.ruolo]:k==='parent'?(x.p.parent?nome(byId(x.p.parent)):''):k==='b'||k==='t'?x.v[k]:(x.p[k]??'');
  const ka=key(A),kb=key(B);let c=typeof ka==='number'&&typeof kb==='number'?ka-kb:String(ka).localeCompare(String(kb),'it',{numeric:true});
  if((ka===''||ka==null)!==(kb===''||kb==null))return ka===''||ka==null?1:-1;return c*d||sortNome(a,b)})}

const opts=(f)=>[...new Set(S.pr.map(p=>String(p[f]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));

function vStruttura(){const ser=S.ser,T=id=>`<span class="tot">personali ${BT(vend(id,ser))}</span>`;

    ${ss.map(nodo).join('')}${cp.map(capo).join('')}${dir.length?`<div class="c"><div class="nh"><b>PR diretti</b><span class="sp"></span><span class="tot">${dir.length} PR</span></div>${leaves(dir)}</div>`:''}${!f.length?'<p class="empty">Nessuno collegato</p>':''}</details>`};
  let h=`<div class="top"><div class="sp"><h2>Struttura dello staff</h2><p class="sub">Capo staff (anche sotto un altro Capo staff) → Capo PR → PR. "Gruppo" e "staff" sommano tutto il ramo; sulle etichette biglietti · tavoli.</p></div><button class="pri" data-new="1">Nuova persona</button></div><div class="tree">`;

    return {p,b,t,e,tot:b+t,n,ne,media:n?(b+t)/n:0,emedia:ne?e/ne:0}}).filter(x=>x.tot>=1||x.e>0).sort((a,b)=>b[key]-a[key]||b.tot-a.tot||sortNome(a.p,b.p));

function vReport(){const loc=S.loc.filter(l=>l.tipo!=='format').sort((a,b)=>a.nome.localeCompare(b.nome,'it')),fm=S.loc.filter(l=>l.tipo==='format').sort((a,b)=>a.nome.localeCompare(b.nome,'it'));

  const tot=ser.reduce((a,s)=>add(a,sumSer(s)),{b:0,t:0,e:0}),inc=tot.e>0,serInc=ser.filter(s=>sumSer(s).e>0).length;
  const stat=new Map();for(const s of ser)for(const id of Object.keys(s.ris||{})){const r=R(s,id);if(r.b<1&&r.t<1&&!r.e)continue;const o=stat.get(id)||{b:0,t:0,e:0,n:0,max:0};o.b+=r.b;o.t+=r.t;o.e+=r.e;o.n++;o.max=Math.max(o.max,r.b+r.t);stat.set(id,o)}

  if(S.repPr&&!stat.has(S.repPr))S.repPr='';const pSel=S.repPr||cls[0]?.[0]||'';

  <div class="grid3"><div class="card"><h3>Biglietti per serata</h3>${colChart('b',ser.map(s=>pt(s,sumSer(s).b)))}</div>
  <div class="card"><h3>Tavoli per serata</h3>${colChart('t',ser.map(s=>pt(s,sumSer(s).t)))}</div>

  ${classifica(ser,loc,fm)}
  <div class="grid2">
  <div class="card"><h3>Trend di un PR</h3><label>PR<select id="rpP">${cls.map(([id])=>`<option value="${id}" ${id===pSel?'selected':''}>${esc(nome(byId(id)))}</option>`).join('')||'<option>Nessuno</option>'}</select></label>
  ${(()=>{const hasE=!!(pSel&&stat.get(pSel)?.e),serie=[{n:'TicketSMS',c:'var(--red)',ax:'l'},{n:'Tavoli',c:'var(--yel)',ax:'l'}].concat(hasE?[{n:'Incasso tavoli',c:'var(--inc)',ax:'r'}]:[]);
    const sw=c=>`<i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block;margin-right:4px"></i>`;

      +groupChart('pg',{serie,pts:pSel?ser.map(s=>{const r=R(s,pSel);return {...pt(s,0),v:[r.b,r.t].concat(hasE?[Math.round(r.e/100)]:[])}}):[]})})()}</div></div>
  <div class="card"><h3>Totale per ramo dello staff</h3>${rami.length?`<div class="tbl s"><table><thead><tr><th>Ramo</th><th class="n">Biglietti</th><th class="n">Tavoli</th>${inc?'<th class="n">Incasso tavoli</th>':''}</tr></thead><tbody>${rami.map(([p,v])=>`<tr><td><button class="link" data-pg="${p.id}">${esc(nome(p))}</button><span class="note i">${RUOLI[p.ruolo]} · ${figli(p.id).length} collegati</span></td><td class="n"><b>${v.b}</b></td><td class="n">${v.t}</td>${inc?`<td class="n">${v.e?eur(v.e):''}</td>`:''}</tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nessun ramo con risultati.</p>'}</div>`}

const PAL=['#e3301c','#ff8a1f','#2f7fd8','#1f9e6e','#ffbf1f','#8a4fd1','#d6337f','#4fb3a9','#a0522d','#6b7a8f','#b38f00','#3b3b98','#ff6f91','#7aa83a','#c45c00','#5e7ce2'];
function scopeTabs(){const loc=S.loc.filter(l=>l.tipo!=='format').sort((a,b)=>a.nome.localeCompare(b.nome,'it')),fm=S.loc.filter(l=>l.tipo==='format').sort((a,b)=>a.nome.localeCompare(b.nome,'it'));

function vPersona(){const id=location.hash.slice(9),p=byId(id);
  if(!p)return `<div class="top"><div class="sp"><h2>Persona non trovata</h2><p class="sub">Potrebbe essere stata eliminata.</p></div><a class="btn" href="#archivio" style="display:inline-flex;align-items:center;text-decoration:none">Torna all'archivio</a></div>`;
  const ser=serOrd().filter(s=>S.rep==='all'||s.loc===S.rep||s.fmt===S.rep);
  const lab=s=>({l:fmtD(s.data).slice(0,5),t:`${fmtD(s.data)} ${s.nome||''}`});
  /* segmenti: risultati personali + collegati (per un capo staff, i Capi PR valgono con tutto il gruppo) */
  const segs=[{n:'Personali',id:null,ruolo:p.ruolo,f:s=>R(s,id)}];
  const f=figli(id).sort((a,b)=>ORD[a.ruolo]-ORD[b.ruolo]||sortNome(a,b));

async function salvaPR(id){const g=k=>$('#p-'+k).value.trim(),m=$('#pM');

    const esiste=S.loc.find(l=>l.tipo===t&&norm(l.nome)===norm(n));
    if(!esiste&&t==='format'&&!eta){m.className='msg';m.textContent='Indica l\'età minima del format.';return}
    try{if(!esiste)await api('POST','/api/locali',{nome:n,tipo:t,eta_min:eta,misura:$('#s-newM').value});await load();
      const nl=S.loc.find(l=>l.tipo===t&&norm(l.nome)===norm(n));
      for(const k of ['locale','format'])selDi(k).innerHTML=S.osel(k,k===t?nl?.id:prec[k]);
      prec[t]=nl?.id||'';nuovoTipo=null;$('#s-new').hidden=true;if(t==='format')listaRis();m.className='msg ok';m.textContent=esiste?`${n} esisteva già: l'ho selezionato.`:`${t==='format'?'Format':'Locale'} "${n}" creato.`}
    catch(er){m.className='msg';m.textContent='Errore: '+(er.message||er.code)}};
  $('#s-q').oninput=e=>{S.rq=e.target.value;listaRis()};
  $('#rl').oninput=e=>{const i=e.target.dataset.r,k=e.target.dataset.k;if(!i)return;const n=k==='e'?cent(e.target.value):Math.max(0,parseInt(e.target.value,10)||0);
    const o={...R(S.draft,i)};o[k]=n;setRis(i,o);e.target.closest('.rr').classList.toggle('has',!!S.draft.ris[i]);totRis()};
  $('#s-ap').onclick=applicaLista;$('#sS').onclick=()=>salvaSerata(id);
  if(id)$('#sD').onclick=async e=>{const b=e.target;if(!b.dataset.c){b.dataset.c=1;b.textContent='Conferma eliminazione';return}
    b.disabled=true;try{await S.db.collection('serate').doc(id).delete();chiudi();toast('Serata eliminata')}catch(er){$('#sM').textContent='Errore: '+(er.message||er.code);b.disabled=false}};
  $('#modal').classList.add('on')}
const setRis=(i,o)=>{if(o.b>=1||o.t>=1||o.e>0)S.draft.ris[i]={b:o.b||0,t:o.t||0,e:o.e||0};else delete S.draft.ris[i]};
const incAttivo=()=>misuraDi($('#s-fmt')?.value)==='incasso'||Object.values(S.draft.ris).some(r=>r&&r.e>0);
function totRis(){const v=sumSer(S.draft);$('#sT').textContent=v.b;$('#sV').textContent=v.t;$('#sE').textContent=eur(v.e);$('#sEw').hidden=!incAttivo();$('#sN').textContent=Object.keys(S.draft.ris).length}
function listaRis(){const q=norm(S.rq),r=S.draft.ris;
  const inc=incAttivo(),cl=inc?' inc':'';
  const inp=(id,k,n)=>{const v=R(S.draft,id)[k];return k==='e'?`<input type="text" inputmode="decimal" data-r="${id}" data-k="e" value="${v?String(v/100).replace('.',','):''}" placeholder="€ 0" aria-label="Incasso tavoli di ${esc(n)}">`:`<input type="number" inputmode="numeric" min="0" data-r="${id}" data-k="${k}" value="${v||''}" placeholder="0" aria-label="${k==='b'?'Biglietti':'Tavoli'} di ${esc(n)}">`};
  const cells=(id,n)=>inp(id,'b',n)+inp(id,'t',n)+(inc?inp(id,'e',n):'');
  const head=`<div class="rr${cl}" style="position:sticky;top:0;background:var(--bg);z-index:1;font-size:13px;color:var(--mute);font-weight:600"><span>PR</span><span style="text-align:right">Biglietti</span><span style="text-align:right">Tavoli</span>${inc?'<span style="text-align:right">Incasso tav. €</span>':''}</div>`;
  const l=[...S.pr].filter(p=>!q||norm(nome(p)).includes(q)).sort((a,b)=>(r[b.id]?1:0)-(r[a.id]?1:0)||sortNome(a,b));
  const orfani=Object.keys(r).filter(k=>!byId(k));
  $('#rl').innerHTML=(l.length||orfani.length)?head+l.map(p=>`<div class="rr${cl} ${r[p.id]?'has':''}"><span>${esc(nome(p))} <span class="note" style="display:inline">${RUOLI[p.ruolo]}${p.parent?' · '+esc(nome(byId(p.parent))):''}</span></span>${cells(p.id,nome(p))}</div>`).join('')+orfani.map(k=>`<div class="rr${cl} has"><span>PR eliminato</span>${cells(k,'PR eliminato')}</div>`).join('')
    :'<p class="empty" style="padding:0 12px">Nessun PR in archivio con questo nome.</p>';totRis()}
function applicaLista(){const idx=new Map();for(const p of S.pr){idx.set(norm(`${p.nome||''} ${p.cognome||''}`),p.id);idx.set(norm(`${p.cognome||''} ${p.nome||''}`),p.id)}
  const inc=misuraDi($('#s-fmt').value)==='incasso';
  const no=[];let ok=0;for(const riga of $('#s-paste').value.split('\n')){const t=riga.trim();if(!t)continue;
    if(inc){const mi=t.match(/^(.*?)[\s;:\t]+€?\s*([\d.]+(?:,\d{1,2})?)\s*€?\s*$/);const id=mi&&idx.get(norm(mi[1].replace(/[;:\t]/g,' ')));if(!id){no.push(mi?mi[1]:t);continue}setRis(id,{...R(S.draft,id),e:cent(mi[2])});ok++;continue}
    const m=t.match(/^(.*?)[\s;,:\t]+(\d+)(?:[\s;,:\t]+(\d+))?\s*$/);
    const id=m&&idx.get(norm(m[1].replace(/[;,:\t]/g,' ')));if(!id){no.push(m?m[1]:t);continue}setRis(id,{b:parseInt(m[2],10),t:m[3]?parseInt(m[3],10):R(S.draft,id).t});ok++}
  listaRis();const msg=$('#sM');msg.className='msg'+(no.length?'':' ok');msg.textContent=`${ok} righe applicate.`+(no.length?` Non trovati in archivio: ${no.slice(0,8).join(', ')}${no.length>8?'…':''}`:'')}
async function salvaSerata(id){const m=$('#sM');m.className='msg';const d={data:$('#s-data').value,nome:$('#s-nome').value.trim(),loc:($('#s-loc').value==='__new'?'':$('#s-loc').value)||null,fmt:($('#s-fmt').value==='__new'?'':$('#s-fmt').value)||null,ris:{}};
  if(!d.data){m.textContent='Inserisci la data della serata.';return}
  for(const k of Object.keys(S.draft.ris)){const r=R(S.draft,k);if(r.b>=1||r.t>=1||r.e>0)d.ris[k]={b:r.b,t:r.t,e:r.e}}
  if(!S.db){m.textContent='Archivio non raggiungibile: impossibile salvare.';return}
  $('#sS').disabled=true;try{const c=S.db.collection('serate');await (id?c.doc(id):c.doc()).set(d);chiudi();toast('Serata salvata')}catch(e){m.textContent='Errore nel salvataggio: '+(e.message||e.code);$('#sS').disabled=false}}
function openLoc(id){const l=S.loc.find(x=>x.id===id);if(!l)return;S.draft={k:'loc',id};
  $('#sheet').innerHTML=`<div class="row"><h2 class="sp">${l.tipo==='format'?'Format':'Locale'}</h2><button class="ghost" data-x="1">Chiudi</button></div>
  <div class="form"><label>Nome<input id="e-nome" value="${esc(l.nome)}"></label>${l.tipo==='format'?`<label>Età minima del target<input id="e-eta" type="number" inputmode="numeric" min="6" max="99" value="${esc(l.eta_min||'')}" placeholder="es. 14"></label><label>Misura principale<select id="e-mis"><option value="persone" ${l.misura!=='incasso'?'selected':''}>Persone (TicketSMS + tavoli)</option><option value="incasso" ${l.misura==='incasso'?'selected':''}>Incasso tavoli (€)</option></select></label>`:''}</div>
  <p class="msg" id="eM"></p><div class="row"><button class="pri" id="eS">Salva</button></div>`;
  $('#eS').onclick=async()=>{const b={nome:$('#e-nome').value.trim(),eta_min:l.tipo==='format'?$('#e-eta').value:null,misura:l.tipo==='format'?$('#e-mis').value:null};
    try{await api('PUT','/api/locali/'+id,b);chiudi();toast('Salvato');await load()}catch(er){$('#eM').textContent=er.message}};
  $('#modal').classList.add('on');$('#e-nome').focus()}
function chiudi(){$('#modal').classList.remove('on');S.draft=null}

/* ---------- eventi ---------- */
document.addEventListener('click',async e=>{const th=e.target.closest('th[data-so]');if(th){const k=th.dataset.so;S.so=S.so.k===k?{k,d:-S.so.d}:{k,d:k==='b'||k==='t'?-1:1};render();return}
  const t=e.target.closest('button,[data-rp]');if(!t)return;const d=t.dataset;
  if(d.pg){location.hash='persona-'+d.pg;scrollTo(0,0)}else if(d.back){if(history.length>1)history.back();else location.hash='archivio'}else if(d.ed)openPR(d.ed);else if(d.new)openPR(null);else if(d.ns)openSerata(null);else if(d.es)openSerata(d.es);else if(d.x)chiudi();
  else if(d.rp){S.rep=d.rp;S.repPr='';render()}else if(d.cl){S.clT=d.cl;render()}else if(d.pt){S.ptT=d.pt;render()}else if(d.tp){S.repPr=d.tp;render();$('#rpP')?.scrollIntoView({block:'center'})}
  else if(t.id==='clr'){S.q=S.fR=S.fS=S.fZ='';render()}
  else if(t.id==='iA'){t.disabled=true;try{await api('PUT','/api/impostazioni',{stagione_inizio:$('#iS').value,punti_persone:$('#iP').value,punti_euro:$('#iE').value});toast('Impostazioni salvate');await load()}catch(er){$('#iM').textContent=er.message;t.disabled=false}}
  else if(t.id==='aA'){const em=$('#aE').value.trim(),pid=$('#aP').value;if(!em||!pid){$('#aM').textContent='Scrivi l\'email e scegli il capo staff.';return}
    t.disabled=true;try{await api('POST','/api/utenti',{email:em,persona_id:pid});toast('Accesso abilitato');await load()}catch(er){$('#aM').textContent=er.message;t.disabled=false}}
  else if(d.du){if(!t.dataset.c){t.dataset.c=1;t.textContent='Conferma';return}try{await api('DELETE','/api/utenti/'+encodeURIComponent(d.du));toast('Accesso tolto');await load()}catch(er){toast(er.message)}}
  else if(d.el)openLoc(d.el);
  else if(t.id==='lA'){const n=$('#lN').value.trim(),ty=$('#lT').value,eta=$('#lE').value;if(!n){$('#lM').textContent='Scrivi il nome.';return}
    if(ty==='format'&&!eta){$('#lM').textContent='Indica l\'età minima del format.';return}
    if(S.loc.some(l=>norm(l.nome)===norm(n)&&l.tipo===ty)){$('#lM').textContent='Esiste già.';return}
    try{await api('POST','/api/locali',{nome:n,tipo:ty,eta_min:eta,misura:$('#lMis').value});toast('Aggiunto');await load()}catch(er){$('#lM').textContent='Errore: '+(er.message||er.code)}}
  else if(d.dl){const u=S.ser.filter(s=>s.loc===d.dl||s.fmt===d.dl).length;if(u){$('#lM').textContent=`Usato in ${u} serate: non si può eliminare.`;return}
    if(!t.dataset.c){t.dataset.c=1;t.textContent='Elimina?';return}try{await S.db.collection('locali').doc(d.dl).delete();toast('Eliminato')}catch(er){$('#lM').textContent='Errore: '+(er.message||er.code)}}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')chiudi()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))chiudi()});
const upd=()=>{$('#tb').innerHTML=righe();const c=$('#cnt');if(c)c.textContent=`${filtrati().length} di ${S.pr.length} persone`};
document.addEventListener('input',e=>{const id=e.target.id;if(id==='q'){S.q=e.target.value;upd()}});
document.addEventListener('change',e=>{const id=e.target.id;if(['fR','fS','fZ'].includes(id)){S[id]=e.target.value;upd()}else if(id==='rpP'){S.repPr=e.target.value;render()}else if(id==='lT'){$('#lE').hidden=$('#lMis').hidden=e.target.value!=='format'}else if(id==='ptF'){S.ptF=e.target.value;S.puntiD=null;render()}else if(id==='clS'){S.clS=e.target.value;render()}else if(id==='clF'){S.rep=e.target.value;S.repPr='';render()}});
window.addEventListener('hashchange',render);

/* ---------- dati (API del sito) ---------- */
const VER='__VER__';
const MAP={pr:'persone',locali:'locali',serate:'serate'};
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'content-type':'application/json','x-ver':VER},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch(_){}
  if(r.status===401||r.redirected&&!r.url.includes('/api/')){location.reload();throw {message:'Sessione scaduta'}}
  if(j.reload){toast(j.error);setTimeout(()=>location.reload(),1500)}
  if(!r.ok)throw {message:j.error||('Errore '+r.status)};return j}
async function load(){try{const d=await api('GET','/api/data');if(d.ver&&d.ver!==VER&&!S.me){location.reload();return}S.me=d.me;S.pr=d.persone;S.loc=d.locali;S.ser=d.serate;S.utenti=d.utenti||[];S.imp=d.imp||S.imp;S.puntiD=null;S.got={pr:1,loc:1,ser:1};banner(d.ver&&d.ver!==VER?'È disponibile una versione nuova del sito: ricarica la pagina.':'');
  render();if(S.draft&&S.draft.k==='ser')listaRis()}catch(e){banner('Impossibile caricare i dati: '+(e.message||e));S.got={pr:1,loc:1,ser:1};render()}}
S.db={collection:c=>({doc:id=>({set:async d=>{await api(id?'PUT':'POST',`/api/${MAP[c]}${id?'/'+id:''}`,d);await load()},
  delete:async()=>{await api('DELETE',`/api/${MAP[c]}/${id}`);await load()}})})};
window.addEventListener('focus',()=>{if(!$('#modal').classList.contains('on'))load()});
load();
render();
}
</script>
</body>
